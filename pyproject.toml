[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dsn-analytics"
version = "0.1.0"
description = "Local synthetic DSN analytics with Python ADK, BigQuery and A2UI"
requires-python = ">=3.12"
dependencies = [
  "google-adk[gcp]==2.15.0",
  "google-cloud-bigquery==3.47.0",
  "a2ui-agent-sdk==0.12.0",
  "fastapi==0.165.0",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlglot==30.33.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
dsn-seed = "dsn_agent.seed:main"

[tool.setuptools.packages.find]
include = ["dsn_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
