steps:
  - id: validate-settings
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args: [scripts/deploy-cloud-run.sh, validate]
  - id: backend-checks
    name: python:3.12-slim-bookworm
    entrypoint: sh
    args:
      - -ceu
      - |
        pip install --no-cache-dir ".[dev]"
        python -m ruff check dsn_agent tests scripts/smoke-container.py
        python -m pytest -q
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - .
  - id: smoke-container
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    args:
      - -ceu
      - |
        docker run --detach --name dsn-container-smoke \
          ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
        trap 'docker logs dsn-container-smoke; docker rm --force dsn-container-smoke' EXIT
        docker exec --interactive dsn-container-smoke python - < scripts/smoke-container.py
  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
  - id: deploy-private-service
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args: [scripts/deploy-cloud-run.sh, deploy]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

substitutions:
  _REGION: ""
  _REPOSITORY: dsn-containers
  _SERVICE: dsn-atelier
  _RUNTIME_SERVICE_ACCOUNT: dsn-runtime
  _DATASET: dsn_demo
  _BIGQUERY_LOCATION: ""
  _VERTEX_LOCATION: ""
  _MODEL: ""

options:
  logging: CLOUD_LOGGING_ONLY
  env:
    - DEPLOY_PROJECT=$PROJECT_ID
    - DEPLOY_BUILD_ID=$BUILD_ID
    - DEPLOY_REGION=${_REGION}
    - DEPLOY_REPOSITORY=${_REPOSITORY}
    - DEPLOY_SERVICE=${_SERVICE}
    - DEPLOY_RUNTIME_SERVICE_ACCOUNT=${_RUNTIME_SERVICE_ACCOUNT}
    - DEPLOY_DATASET=${_DATASET}
    - DEPLOY_BIGQUERY_LOCATION=${_BIGQUERY_LOCATION}
    - DEPLOY_VERTEX_LOCATION=${_VERTEX_LOCATION}
    - DEPLOY_MODEL=${_MODEL}

timeout: 1800s
